name: Validate and build Japanstudy

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "japanstudy-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate scoring and question banks
        run: |
          node --check sw.js
          node tests/core.test.mjs
          node tests/sync-model.test.mjs
          node tests/cloud-sync.test.mjs
      - name: Build public site
        run: python3 tools/build_site.py
      - name: Upload public site package
        uses: actions/upload-artifact@v4
        with:
          name: japanstudy-site
          path: _site
          include-hidden-files: true
