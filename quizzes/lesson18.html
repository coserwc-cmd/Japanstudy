<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#d86f5c"><title>第18课词汇｜Japanstudy</title><style>:root{--bg:#f6f3ed;--card:#fff;--ink:#252525;--muted:#77736d;--accent:#d86f5c;--good:#2f8f62;--bad:#c84646;--line:#e7dfd4}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.card{background:var(--card);border-radius:22px;padding:20px 16px;box-shadow:0 8px 28px rgba(0,0,0,.07)}h1{font-size:29px;margin:0 0 8px}.sub{color:var(--muted);line-height:1.6}.stats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.pill{display:inline-block;border-radius:999px;background:#eee8df;padding:5px 9px;font-size:12px;font-weight:800}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}.btn{border:0;border-radius:15px;padding:14px 12px;font:inherit;font-weight:800;background:#e9e3da;color:#333}.btn.primary{background:var(--accent);color:#fff}.btn.good{background:var(--good);color:#fff}.btn.dark{background:#34312e;color:#fff}.btn:disabled{opacity:.45}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px}.progress{height:8px;background:#ebe5dc;border-radius:999px;overflow:hidden;margin:16px 0 18px}.bar{height:100%;background:var(--accent);width:0;transition:.25s}.prompt-label{text-align:center;color:var(--muted);font-size:14px}.prompt{text-align:center;font-size:31px;font-weight:900;line-height:1.4;margin:12px 0 20px;overflow-wrap:anywhere}.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:15px;padding:14px 15px;font-size:17px;min-height:54px}.option.correct{border-color:var(--good);background:#edf8f1;color:#17643b}.option.wrong{border-color:var(--bad);background:#fff0f0;color:#8b2929}.option:disabled{opacity:1}.feedback{min-height:48px;margin-top:12px;text-align:center;font-weight:800;line-height:1.45}.next{width:100%;margin-top:4px}.score{font-size:54px;font-weight:900;text-align:center;margin:8px 0}.wrong-list{display:grid;gap:10px;margin-top:16px}.wrong-item{background:#fff7f7;border:1px solid #f0caca;border-radius:15px;padding:13px}.wrong-q{font-weight:850}.wrong-a{font-size:14px;line-height:1.6}.bad{color:var(--bad)}.good-text{color:var(--good)}.note{margin-top:12px;background:#fff7dd;color:#6d591d;border-radius:14px;padding:12px 13px;line-height:1.55;font-size:14px}.back{display:inline-block;margin-bottom:12px;color:#655f59;text-decoration:none;font-weight:700}</style></head><body><div class="wrap"><section class="card" id="home"><a class="back" href="../index.html">‹ 返回首页</a><h1>第18课词汇</h1><p class="sub">根据你今天发来的三页第18课词汇制作。共65词，支持双向选择、自动记分和错题重练。</p><div class="stats"><span class="pill">65词</span><span class="pill">假名 → 中文</span><span class="pill">中文 → 假名</span></div><div class="menu"><button class="btn primary" id="start1">第一部分<br>假名 → 中文</button><button class="btn dark" id="start2">第二部分<br>中文 → 假名</button></div><button class="btn good" id="resume" style="width:100%;margin-top:10px">练习已保存错题</button><div class="note">答错的题会保存在这台设备上；重练时答对后会自动从错题集移除。</div></section><section class="card hidden" id="quiz"><div class="meta"><span id="sessionName"></span><span id="counter"></span></div><div class="progress"><div class="bar" id="bar"></div></div><div class="prompt-label" id="label"></div><div class="prompt" id="prompt"></div><div class="options" id="options"></div><div class="feedback" id="feedback"></div><button class="btn primary next hidden" id="next">下一题</button></section><section class="card hidden" id="result"><div class="score" id="score"></div><div id="message" style="text-align:center"></div><div class="menu"><button class="btn good" id="retryWrong">重做本轮错题</button><button class="btn" id="retryAll">练习全部错题</button></div><div class="menu"><button class="btn" id="restart">重新做本部分</button><button class="btn dark" id="backHome">返回本页首页</button></div><div class="wrong-list" id="wrongList"></div></section></div><script>const V=[['まず','首先；先'],['はいります','开启；接通（开关/电源）'],['つぎに','接下来；下一步'],['セットします','设置（时间等）'],['それから','然后；从那以后'],['ストレッチします','拉伸；做伸展运动'],['かいさつ','检票口'],['ひらきます','打开'],['クリックします','点击'],['ろくおん','录音'],['ながれます','流动；播放出来'],['ただしい','正确的'],['えらびます','选择'],['しょっけん','餐券；饭票'],['マイク','麦克风'],['おと','声音'],['ATM','自动取款机'],['あんしょうばんごう','密码；PIN码'],['にゅうりょくします','输入'],['きんがく','金额'],['かくにん','确认'],['ろせんず','线路图'],['かけます','挂；悬挂'],['バッグハンガー','包包挂钩'],['なべ','锅'],['なべつかみ','隔热手套；锅用手套'],['ホッチキス','订书机'],['はり','针'],['はずします','取下；拆下'],['ホッチキスリムーバー','起钉器'],['バッテリー','电池；蓄电池'],['けいたいでんわ','手机；移动电话'],['じゅうでんします','充电'],['いためます','炒'],['にます','煮；炖'],['フォー','越南河粉（Pho）'],['かっこいい','帅；好看；酷'],['けっこん','结婚'],['バインセオ','越南煎饼（Bánh xèo）'],['レタス','生菜'],['のせます','放在上面'],['まきます','卷；缠绕'],['おび','腰带（和服/浴衣）'],['むすびます','系；绑；打结'],['おりがみ','折纸'],['おります','折；折叠'],['ぎゅうにく','牛肉'],['うけつけ','接待处；前台'],['にゅうかんしょう','入馆证'],['たまねぎ','洋葱'],['ミキサー','搅拌机；料理机'],['おやこどん','亲子丼；鸡肉鸡蛋盖饭'],['ひゃくえんショップ','百元店'],['まっすぐ','直走；笔直'],['ペン','笔'],['せなか','后背'],['ボタン','纽扣；按钮'],['いかがですか','怎么样？（礼貌说法）'],['ファスナー','拉链'],['みち','路；道路'],['かど','拐角；街角'],['まがります','转弯'],['こうさてん','十字路口；交叉路口'],['〜つめ（ふたつめ）','第……个（第二个）'],['にしくやくしょ','西区役所']];const KEY='lesson18-wrongs-v1';const $=x=>document.getElementById(x);let mode='p1',session=[],i=0,score=0,wrongs=[],answered=false;function sh(a){a=[...a];for(let x=a.length-1;x>0;x--){const j=Math.floor(Math.random()*(x+1));[a[x],a[j]]=[a[j],a[x]]}return a}function q(idx,m){const v=V[idx],pool=V.map(x=>m==='p1'?x[1]:x[0]).filter(x=>x!==(m==='p1'?v[1]:v[0]));return{id:m+'-'+idx,idx,mode:m,prompt:m==='p1'?v[0]:v[1],correct:m==='p1'?v[1]:v[0],options:sh([m==='p1'?v[1]:v[0],...sh(pool).slice(0,3)])}}function start(m){mode=m;session=sh(V.map((_,x)=>q(x,m)));begin()}function begin(){i=0;score=0;wrongs=[];$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}function render(){answered=false;const x=session[i];$('sessionName').textContent=mode==='p1'?'第一部分':'第二部分';$('counter').textContent=(i+1)+' / '+session.length;$('bar').style.width=(i/session.length*100)+'%';$('label').textContent=x.mode==='p1'?'请选择正确的中文意思':'请选择正确的日语';$('prompt').textContent=x.prompt;$('feedback').textContent='';$('next').classList.add('hidden');$('options').innerHTML='';x.options.forEach(t=>{const b=document.createElement('button');b.className='option';b.textContent=t;b.onclick=()=>choose(b,t);$('options').appendChild(b)})}function choose(btn,t){if(answered)return;answered=true;const x=session[i];[...document.querySelectorAll('.option')].forEach(b=>{b.disabled=true;if(b.textContent===x.correct)b.classList.add('correct')});if(t===x.correct){score++;removeSaved(x.id);$('feedback').textContent='✓ 回答正确'}else{btn.classList.add('wrong');$('feedback').innerHTML='✕ 正确答案：<strong>'+x.correct+'</strong>';const w={id:x.id,idx:x.idx,mode:x.mode,prompt:x.prompt,selected:t,correct:x.correct};wrongs.push(w);saveWrong(w)}$('next').classList.remove('hidden');$('bar').style.width=((i+1)/session.length*100)+'%'}function next(){i++;i>=session.length?finish():render()}function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');$('score').textContent=score+' / '+session.length;$('message').textContent=wrongs.length?'本轮有 '+wrongs.length+' 道错题。':'这一轮全部答对。';$('retryWrong').disabled=!wrongs.length;$('retryAll').disabled=!saved().length;const box=$('wrongList');box.innerHTML='';wrongs.forEach((w,n)=>{const d=document.createElement('div');d.className='wrong-item';d.innerHTML='<div class="wrong-q">'+(n+1)+'. '+w.prompt+'</div><div class="wrong-a bad">你的答案：'+w.selected+'</div><div class="wrong-a good-text">正确答案：'+w.correct+'</div>';box.appendChild(d)});updateResume()}function saved(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function setSaved(a){const m=new Map();a.forEach(w=>m.set(w.id,w));localStorage.setItem(KEY,JSON.stringify([...m.values()]))}function saveWrong(w){setSaved([...saved(),w])}function removeSaved(id){setSaved(saved().filter(w=>w.id!==id))}function startWrong(list){if(!list.length)return;mode='wrong';session=sh(list.map(w=>q(w.idx,w.mode)));begin()}function updateResume(){const n=saved().length;$('resume').disabled=!n;$('resume').textContent=n?'练习已保存错题（'+n+'题）':'练习已保存错题（暂无）'}$('start1').onclick=()=>start('p1');$('start2').onclick=()=>start('p2');$('next').onclick=next;$('retryWrong').onclick=()=>startWrong(wrongs);$('retryAll').onclick=()=>startWrong(saved());$('restart').onclick=()=>start(mode==='p2'?'p2':'p1');$('backHome').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('home').classList.remove('hidden');updateResume()};$('resume').onclick=()=>startWrong(saved());updateResume();</script></body></html>
