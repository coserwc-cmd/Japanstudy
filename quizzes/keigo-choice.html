<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#d86f5c"><title>敬语互选测试</title><style>
:root{--bg:#f7f4ef;--card:#fff;--ink:#252525;--muted:#777;--line:#e7dfd4;--main:#d86f5c;--purple:#7a66d9;--good:#2f8f62;--bad:#d34f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}.wrap{max-width:720px;margin:auto;padding:calc(18px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom))}.card{background:var(--card);border-radius:22px;padding:20px 16px;box-shadow:0 8px 28px rgba(0,0,0,.07)}h1{margin:0 0 7px;font-size:29px}.sub{color:var(--muted);line-height:1.6}.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.btn{border:0;border-radius:15px;padding:14px 12px;font:inherit;font-weight:800;background:#ebe5dc}.btn.main{background:var(--main);color:white}.btn.purple{background:var(--purple);color:white}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;color:var(--muted);margin-bottom:14px}.barbg{height:8px;background:#ebe5dc;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,var(--main),var(--purple));width:0}.badge{display:inline-block;margin:16px 0 4px;padding:6px 10px;border-radius:999px;font-weight:800;font-size:13px}.honor{background:#fff1ed;color:#ad4f3d}.humble{background:#f0edff;color:#5c47c7}.prompt{color:var(--muted);text-align:center;margin-top:10px}.stem{text-align:center;font-size:31px;font-weight:900;line-height:1.35;margin:10px 0 18px}.opts{display:grid;gap:10px}.opt{border:2px solid var(--line);background:white;border-radius:15px;padding:14px;text-align:left;font:inherit;font-size:18px}.correct{border-color:var(--good)!important;background:#eefaf3!important}.wrong{border-color:var(--bad)!important;background:#fff3f3!important}.feedback{margin-top:12px;text-align:center;font-weight:800;line-height:1.5}.score{text-align:center;font-size:52px;font-weight:900;margin:10px}.wrongitem{padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:10px;line-height:1.55}.back{display:block;text-align:center;margin-top:14px;color:#666;text-decoration:none}</style></head><body><div class="wrap">
<section id="home" class="card"><h1>敬语互选测试</h1><div class="sub">原型 ⇄ 敬语双向练习。每题都会标明是尊敬语还是谦让语，并自动记分、汇总错题。</div><div class="menu"><button class="btn main" onclick="start('forward')">原型 → 敬语</button><button class="btn purple" onclick="start('reverse')">敬语 → 原型</button></div><a class="back" href="../index.html">← 回到学习首页</a></section>
<section id="quiz" class="card hidden"><div class="meta"><span id="mode"></span><span id="count"></span></div><div class="barbg"><div id="bar" class="bar"></div></div><div id="badge" class="badge honor"></div><div id="prompt" class="prompt"></div><div id="stem" class="stem"></div><div id="opts" class="opts"></div><div id="fb" class="feedback"></div><button id="next" class="btn main hidden" style="width:100%;margin-top:12px" onclick="nextQ()">下一题</button></section>
<section id="result" class="card hidden"><div class="sub" style="text-align:center">本轮完成</div><div id="score" class="score"></div><div id="summary" style="text-align:center"></div><div id="wronglist"></div><div class="menu"><button class="btn main" onclick="redoWrong()">只做错题</button><button class="btn" onclick="goHome()">返回首页</button></div></section>
</div><script>const DATA=[{"plain":"行きます","keigo":"いらっしゃいます","type":"尊敬語"},{"plain":"来ます","keigo":"いらっしゃいます","type":"尊敬語"},{"plain":"います","keigo":"いらっしゃいます","type":"尊敬語"},{"plain":"言います","keigo":"おっしゃいます","type":"尊敬語"},{"plain":"します","keigo":"なさいます","type":"尊敬語"},{"plain":"飲みます","keigo":"めしあがります","type":"尊敬語"},{"plain":"食べます","keigo":"めしあがります","type":"尊敬語"},{"plain":"見ます","keigo":"ごらんになります","type":"尊敬語"},{"plain":"知っています","keigo":"ごぞんじです","type":"尊敬語"},{"plain":"研究しています","keigo":"けんきゅうしていらっしゃいます","type":"尊敬語"},{"plain":"会います","keigo":"お会いになります","type":"尊敬語"},{"plain":"聞きます","keigo":"お聞きになります","type":"尊敬語"},{"plain":"質問します","keigo":"ご質問なさいます","type":"尊敬語"},{"plain":"もらいます","keigo":"お受け取りになります","type":"尊敬語"},{"plain":"行きます","keigo":"まいります","type":"謙譲語"},{"plain":"行きます（去拜访）","keigo":"うかがいます","type":"謙譲語"},{"plain":"来ます","keigo":"まいります","type":"謙譲語"},{"plain":"います","keigo":"おります","type":"謙譲語"},{"plain":"言います","keigo":"もうします","type":"謙譲語"},{"plain":"します","keigo":"いたします","type":"謙譲語"},{"plain":"飲みます","keigo":"いただきます","type":"謙譲語"},{"plain":"食べます","keigo":"いただきます","type":"謙譲語"},{"plain":"見ます","keigo":"はいけんします","type":"謙譲語"},{"plain":"知っています","keigo":"ぞんじております","type":"謙譲語"},{"plain":"研究しています","keigo":"けんきゅうしております","type":"謙譲語"},{"plain":"会います","keigo":"お目にかかります","type":"謙譲語"},{"plain":"聞きます","keigo":"うかがいます","type":"謙譲語"},{"plain":"質問します","keigo":"うかがいます","type":"謙譲語"},{"plain":"もらいます","keigo":"いただきます","type":"謙譲語"}];let mode='forward',q=[],i=0,s=0,wr=[],answered=false;const $=x=>document.getElementById(x);function sh(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function pools(type,key){return [...new Set(DATA.filter(x=>x.type===type).map(x=>x[key]))]}function build(item){let ans=mode==='forward'?item.keigo:item.plain;let key=mode==='forward'?'keigo':'plain';let pool=pools(item.type,key).filter(x=>x!==ans);return{...item,ans,opts:sh([ans,...sh(pool).slice(0,3)])}}function show(id){['home','quiz','result'].forEach(x=>$(x).classList.add('hidden'));$(id).classList.remove('hidden')}function start(m){mode=m;q=sh(DATA.map(build));i=0;s=0;wr=[];show('quiz');render()}function render(){answered=false;let x=q[i];$('mode').textContent=mode==='forward'?'原型 → 敬语':'敬语 → 原型';$('count').textContent=`${i+1} / ${q.length}`;$('bar').style.width=`${i/q.length*100}%`;$('badge').textContent=x.type;$('badge').className='badge '+(x.type==='尊敬語'?'honor':'humble');$('prompt').textContent=mode==='forward'?'选择正确的敬语表达':'选择对应的原型（普通形）';$('stem').textContent=mode==='forward'?x.plain:x.keigo;$('fb').textContent='';$('next').classList.add('hidden');$('opts').innerHTML='';x.opts.forEach(t=>{let b=document.createElement('button');b.className='opt';b.textContent=t;b.onclick=()=>choose(b,t);$('opts').appendChild(b)})}function choose(b,t){if(answered)return;answered=true;let x=q[i];let all=[...document.querySelectorAll('.opt')];all.forEach(z=>{z.disabled=true;if(z.textContent===x.ans)z.classList.add('correct')});if(t===x.ans){s++;$('fb').textContent='✓ 回答正确'}else{b.classList.add('wrong');$('fb').innerHTML=`✕ 正确答案：<b>${x.ans}</b>`;wr.push(x)}$('next').classList.remove('hidden')}function nextQ(){i++;i>=q.length?finish():render()}function finish(){show('result');$('score').textContent=`${s} / ${q.length}`;$('summary').textContent=wr.length?`错 ${wr.length} 题，下面可以只重做错题。`:'全部答对！';$('wronglist').innerHTML='';wr.forEach((x,n)=>{let d=document.createElement('div');d.className='wrongitem';d.innerHTML=`<b>${n+1}. [${x.type}]</b> ${mode==='forward'?x.plain:x.keigo}<br>正确：${x.ans}`;$('wronglist').appendChild(d)})}function redoWrong(){if(!wr.length)return;q=sh(wr.map(build));i=0;s=0;wr=[];show('quiz');render()}function goHome(){show('home')}</script></body></html>
